<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classic Snake Game</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --board-bg: #1e293b;
      --snake: #10b981;
      --food: #ef4444;
      --text: #f8fafc;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .header {
      text-align: center;
      margin-bottom: 15px;
    }

    .score-board {
      font-size: 1.2rem;
      font-weight: bold;
      margin-top: 5px;
    }

    canvas {
      background-color: var(--board-bg);
      border: 3px solid #334155;
      border-radius: 8px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }

    .controls-hint {
      margin-top: 15px;
      font-size: 0.9rem;
      color: #94a3b8;
    }

    button {
      margin-top: 15px;
      padding: 10px 20px;
      background-color: #6366f1;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>Classic Snake</h1>
    <div class="score-board">Score: <span id="score">0</span></div>
  </div>

  <canvas id="gameCanvas" width="400" height="400"></canvas>
  <button onclick="resetGame()">Restart Game</button>
  <div class="controls-hint">Use Arrow Keys (Up, Down, Left, Right) to Move</div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const gridSize = 20;
    const tileCount = canvas.width / gridSize;

    let snake = [{ x: 10, y: 10 }];
    let food = { x: 15, y: 15 };
    let dx = 0;
    let dy = 0;
    let score = 0;
    let gameInterval;
    let gameStarted = false;

    function gameLoop() {
      moveSnake();
      if (checkGameOver()) {
        alert(`Game Over! Final Score: ${score}`);
        resetGame();
        return;
      }
      clearCanvas();
      drawFood();
      drawSnake();
    }

    function clearCanvas() {
      ctx.fillStyle = "#1e293b";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    function drawSnake() {
      ctx.fillStyle = "#10b981";
      snake.forEach((segment, index) => {
        // Rounded corners for head
        if (index === 0) ctx.fillStyle = "#34d399";
        else ctx.fillStyle = "#10b981";
        
        ctx.fillRect(
          segment.x * gridSize + 1, 
          segment.y * gridSize + 1, 
          gridSize - 2, 
          gridSize - 2
        );
      });
    }

    function drawFood() {
      ctx.fillStyle = "#ef4444";
      ctx.beginPath();
      ctx.arc(
        food.x * gridSize + gridSize / 2, 
        food.y * gridSize + gridSize / 2, 
        gridSize / 2 - 2, 
        0, 
        Math.PI * 2
      );
      ctx.fill();
    }

    function moveSnake() {
      const head = { x: snake[0].x + dx, y: snake[0].y + dy };

      // Prevent moving before key press
      if (dx === 0 && dy === 0) return;

      snake.unshift(head);

      // Check food collision
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        document.getElementById("score").textContent = score;
        generateFood();
      } else {
        snake.pop();
      }
    }

    function generateFood() {
      food = {
        x: Math.floor(Math.random() * tileCount),
        y: Math.floor(Math.random() * tileCount)
      };
      // Prevent food spawning on snake body
      snake.forEach(segment => {
        if (segment.x === food.x && segment.y === food.y) generateFood();
      });
    }

    function checkGameOver() {
      if (dx === 0 && dy === 0) return false;

      const head = snake[0];

      // Wall collision
      const hitWall = head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount;
      if (hitWall) return true;

      // Self collision
      for (let i = 1; i < snake.length; i++) {
        if (head.x === snake[i].x && head.y === snake[i].y) return true;
      }

      return false;
    }

    document.addEventListener("keydown", (e) => {
      switch (e.key) {
        case "ArrowUp":
          if (dy !== 1) { dx = 0; dy = -1; }
          break;
        case "ArrowDown":
          if (dy !== -1) { dx = 0; dy = 1; }
          break;
        case "ArrowLeft":
          if (dx !== 1) { dx = -1; dy = 0; }
          break;
        case "ArrowRight":
          if (dx !== -1) { dx = 1; dy = 0; }
          break;
      }
    });

    function resetGame() {
      clearInterval(gameInterval);
      snake = [{ x: 10, y: 10 }];
      dx = 0;
      dy = 0;
      score = 0;
      document.getElementById("score").textContent = score;
      generateFood();
      gameInterval = setInterval(gameLoop, 100);
    }

    resetGame();
  </script>
</body>
</html>
